version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing"]
      interval: 5s
      timeout: 5s
      retries: 5

  stripe-mock:
    image: stripe/stripe-mock:latest
    ports:
      - "12111:12111"
      - "12112:12112"

  api:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      stripe-mock:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./seed.py:/code/seed.py
      - ./fixtures:/code/fixtures
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
